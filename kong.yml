_format_version: "3.0"
_transform: true

services:
  - name: sat-order-service
    url: http://sat-order-payment-service:3000
    routes:
      - name: order-routes
        paths:
          - /api/v1/orders
          - /api/v1/payments/webhook
    plugins:
      - name: jwt
        config:
          uri_param_names:
            - jwt
          claims_to_verify:
            - exp

  - name: keycloak-service
    url: http://keycloak:8080
    routes:
      - name: keycloak-routes
        paths:
          - /auth

  - name: sat-partner-mock-service
    url: http://sat-partner-mock-service:3002
    routes:
      - name: partner-routes
        paths:
          - /partner/v1/checkout
