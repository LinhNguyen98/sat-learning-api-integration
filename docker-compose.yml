version: '3.8'

services:
  sat-order-payment-service:
    build: ./src/sat-order-payment-service
    container_name: sat-order-payment-service
    ports:
      - "3000:3000"
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - PARTNER_URL=http://sat-partner-mock-service:3002
    depends_on:
      - rabbitmq

  sat-partner-mock-service:
    build: ./src/sat-partner-mock-service
    container_name: sat-partner-mock-service
    ports:
      - "3002:3002"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/keycloak-realm.json:/opt/keycloak/data/import/realm.json

  kong:
    image: kong:3.4
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./infra/kong/kong.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      - sat-order-payment-service
      - sat-partner-mock-service
      - keycloak

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
