apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sat-learning
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'sat-order-service'
        static_configs:
          - targets: ['sat-order-payment-service:3000']
      - job_name: 'sat-partner-mock'
        static_configs:
          - targets: ['sat-partner-mock-service:3002']
      - job_name: 'kong-gateway'
        static_configs:
          - targets: ['kong-gateway:8001']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sat-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus/
      volumes:
      - name: prometheus-config-volume
        configMap:
          name: prometheus-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sat-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.0.0
        ports:
        - containerPort: 3000
