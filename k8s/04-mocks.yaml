apiVersion: apps/v1
kind: Deployment
metadata:
  name: sat-partner-mock-service
  namespace: sat-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sat-partner-mock
  template:
    metadata:
      labels:
        app: sat-partner-mock
    spec:
      containers:
      - name: partner-mock
        image: sat-partner-mock-service:latest
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: sat-partner-mock-service
  namespace: sat-learning
spec:
  selector:
    app: sat-partner-mock
  ports:
  - port: 3002
    targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: sat-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:22.0.1
        args: ["start-dev"]
        env:
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: sat-learning
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: keycloak
